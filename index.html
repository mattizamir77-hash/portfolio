<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תיק עבודות - מתי</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <h1>תיק עבודות - הדר הדגמה</h1>
        <p>מעבר עכבר יפעיל את הסרטון. לחץ על הלחצנים למטה לבחירת מצב.</p>
        
        <div class="mode-toggle">
            <button id="regularMode" class="active">רגיל</button>
            <button id="scaryMode">מפחיד</button>
        </div>
    </header>

    <main class="portfolio-grid">
        <div class="project-card" id="mainProjectCard">
            <video class="project-video" muted loop preload="none">
                <source id="regularSrc" src="bearvideo.mp4" type="video/mp4"> 
                <source id="scarySrc" src="scaryvideo.mp4" type="video/mp4">
            </video>
            
            <div class="project-info">
                <svg viewBox="0 0 300 300" class="curve-text-svg">
                    <path id="curve-path" fill="none" d="M 25 150 A 125 125 0 0 0 275 150" />
                    <text class="curved-text">
                        <textPath href="#curve-path" startOffset="50%" text-anchor="middle">
                            Recycled Styrofoam Objects
                        </textPath>
                    </text>
                </svg>
            </div>
        </div>
    </main>
    <script src="script.js"></script> 
</body>
</html>
