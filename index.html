<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="portfolio-grid">
        <div class="project-card" id="mainProjectCard">
            <video class="project-video" muted preload="auto" poster="bearimage.png">
                <source id="regularSrc" src="/portfolio/bearregular.webm" type="video/webm">
                <source id="scarySrc" src="/portfolio/scaryvideo.webm" type="video/webm">
                <source id="cuteSrc" src="/portfolio/cutemagicvideo.mp4" type="video/mp4">
            </video>
            
            </div>
    </main>

    <audio id="scaryRoarSound" preload="auto">
        <source src="/portfolio/scary_roar.mp3" type="audio/mp3">
    </audio>
    
    <audio id="eatingSound" preload="auto">
        <source src="/portfolio/eating_sound.mp3" type="audio/mp3">
    </audio>
    
    <audio id="magicSound" preload="auto">
        <source src="/portfolio/magic_sound.mp3" type="audio/mp3">
    </audio>

    <script src="script.js"></script>
</body>
</html>
